name: Bootstrap dev infrastructure

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type bootstrap-dev to confirm resource creation
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: fit-infra-bootstrap-dev
  cancel-in-progress: false

jobs:
  bootstrap:
    if: inputs.confirm == 'bootstrap-dev'
    runs-on: ubuntu-latest
    environment: dev
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize local bootstrap state
        working-directory: environments/dev
        run: terraform init -backend=false -input=false

      - name: Apply shared infrastructure
        working-directory: environments/dev
        run: terraform apply -input=false -auto-approve


      - name: Print integration outputs
        working-directory: environments/dev
        run: terraform output
