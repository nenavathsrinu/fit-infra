name: Feature infrastructure

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Choose the feature environment operation
        required: true
        type: choice
        default: apply
        options:
          - apply
          - destroy
      confirm_destroy:
        description: Type DESTROY only when destroying dev
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: feature-infrastructure-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan-dev:
    name: Plan dev
    if: startsWith(github.ref_name, 'feature-') && inputs.operation == 'apply'
    runs-on: ubuntu-latest
    environment: dev
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}

    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
      - name: Initialize Terraform
        working-directory: environments/dev
        run: terraform init -input=false -reconfigure
      - name: Create plan
        working-directory: environments/dev
        run: terraform plan -input=false -out=tfplan
      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: dev-tfplan-${{ github.run_id }}
          path: environments/dev/tfplan

  apply-dev:
    name: Apply dev
    needs: plan-dev
    if: needs.plan-dev.result == 'success' && inputs.operation == 'apply'
    runs-on: ubuntu-latest
    environment: dev
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}

    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
      - uses: actions/download-artifact@v4
        with:
          name: dev-tfplan-${{ github.run_id }}
          path: environments/dev
      - name: Initialize Terraform
        working-directory: environments/dev
        run: terraform init -input=false -reconfigure
      - name: Apply plan
        working-directory: environments/dev
        run: terraform apply -input=false tfplan

  notify-dev:
    name: Notify dev deployment
    needs: [plan-dev, apply-dev]
    if: always() && inputs.operation == 'apply'
    runs-on: ubuntu-latest
    steps:
      - name: Publish result
        env:
          PLAN_RESULT: ${{ needs.plan-dev.result }}
          APPLY_RESULT: ${{ needs.apply-dev.result }}
        run: |
          echo "## Dev deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Plan: ${PLAN_RESULT}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Apply: ${APPLY_RESULT}" >> "$GITHUB_STEP_SUMMARY"
      - name: Send Slack notification when configured
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PLAN_RESULT: ${{ needs.plan-dev.result }}
          APPLY_RESULT: ${{ needs.apply-dev.result }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl --fail --silent --show-error -X POST -H 'Content-type: application/json' --data "{\"text\":\"fit-infra dev: plan=${PLAN_RESULT}, apply=${APPLY_RESULT}\"}" "$SLACK_WEBHOOK_URL"
          fi
      - name: Send deployment email
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: 465
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: fit-infra dev deployment
          to: alexinvi@gmail.com
          from: ${{ secrets.SMTP_FROM }}
          body: |
            Dev deployment completed.
            Plan: ${{ needs.plan-dev.result }}
            Apply: ${{ needs.apply-dev.result }}

  destroy-dev:
    name: Destroy dev
    if: startsWith(github.ref_name, 'feature-') && inputs.operation == 'destroy' && inputs.confirm_destroy == 'DESTROY'
    runs-on: ubuntu-latest
    environment: dev
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Destructive operation warning
        run: |
          echo "::warning title=DESTRUCTIVE OPERATION::Terraform will destroy the dev feature environment."
          echo "## WARNING: DESTROY DEV" >> "$GITHUB_STEP_SUMMARY"
          echo "Terraform destroy will permanently remove managed dev resources." >> "$GITHUB_STEP_SUMMARY"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Initialize Terraform
        working-directory: environments/dev
        run: terraform init -input=false -reconfigure
      - name: Destroy dev infrastructure
        working-directory: environments/dev
        run: terraform destroy -input=false -auto-approve
