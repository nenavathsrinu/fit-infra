name: Feature infrastructure

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: feature-infrastructure-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-dev:
    name: Deploy dev
    runs-on: ubuntu-latest
    environment: dev
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Inspect OIDC claims
        run: |
          token_response=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          token=$(printf '%s' "$token_response" | jq -r '.value')
          payload=$(printf '%s' "$token" | cut -d '.' -f 2 | tr '_-' '/+')
          payload="$(printf '%s' "$payload" | base64 -d 2>/dev/null || true)"
          printf '%s' "$payload" | jq '{iss, aud, sub, repository, repository_owner, ref}'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::865609249710:role/github-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize Terraform
        working-directory: environments/dev
        run: terraform init -input=false -reconfigure -backend-config="bucket=${{ vars.TF_STATE_BUCKET_NAME }}" -backend-config="dynamodb_table=${{ vars.TF_STATE_LOCK_TABLE_NAME }}" -backend-config="region=${{ env.AWS_REGION }}"

      - name: Apply dev infrastructure
        working-directory: environments/dev
        env:
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_cluster_name: ${{ vars.CLUSTER_NAME }}
          TF_VAR_network_name: ${{ vars.NETWORK_NAME }}
          TF_VAR_tf_state_bucket_name: ${{ vars.TF_STATE_BUCKET_NAME }}
          TF_VAR_tf_state_lock_table_name: ${{ vars.TF_STATE_LOCK_TABLE_NAME }}
        run: terraform apply -input=false -auto-approve

  deploy-devint:
    name: Deploy devint
    runs-on: ubuntu-latest
    environment: devint
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Inspect OIDC claims
        run: |
          token_response=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          token=$(printf '%s' "$token_response" | jq -r '.value')
          payload=$(printf '%s' "$token" | cut -d '.' -f 2 | tr '_-' '/+')
          payload="$(printf '%s' "$payload" | base64 -d 2>/dev/null || true)"
          printf '%s' "$payload" | jq '{iss, aud, sub, repository, repository_owner, ref}'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::865609249710:role/github-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize Terraform
        working-directory: environments/devint
        run: terraform init -input=false -reconfigure -backend-config="bucket=${{ vars.TF_STATE_BUCKET_NAME }}" -backend-config="dynamodb_table=${{ vars.TF_STATE_LOCK_TABLE_NAME }}" -backend-config="region=${{ env.AWS_REGION }}"

      - name: Apply devint infrastructure
        working-directory: environments/devint
        env:
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_cluster_name: ${{ vars.CLUSTER_NAME }}
          TF_VAR_network_name: ${{ vars.NETWORK_NAME }}
          TF_VAR_tf_state_bucket_name: ${{ vars.TF_STATE_BUCKET_NAME }}
          TF_VAR_tf_state_lock_table_name: ${{ vars.TF_STATE_LOCK_TABLE_NAME }}
        run: terraform apply -input=false -auto-approve
