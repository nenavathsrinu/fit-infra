name: Release infrastructure

on:
  push:
    branches:
      - 'release-*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-infrastructure-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan-devint:
    name: Plan devint
    runs-on: ubuntu-latest
    environment: devint
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
      - name: Initialize Terraform
        working-directory: environments/devint
        run: terraform init -input=false -reconfigure
      - name: Create plan
        working-directory: environments/devint
        run: terraform plan -input=false -out=tfplan
      - uses: actions/upload-artifact@v4
        with:
          name: devint-tfplan-${{ github.run_id }}
          path: environments/devint/tfplan

  apply-devint:
    name: Apply devint
    needs: plan-devint
    if: needs.plan-devint.result == 'success'
    runs-on: ubuntu-latest
    environment: devint
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
      - uses: actions/download-artifact@v4
        with:
          name: devint-tfplan-${{ github.run_id }}
          path: environments/devint
      - name: Initialize Terraform
        working-directory: environments/devint
        run: terraform init -input=false -reconfigure
      - name: Apply plan
        working-directory: environments/devint
        run: terraform apply -input=false tfplan

  notify-devint:
    name: Notify devint deployment
    needs: [plan-devint, apply-devint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Publish result
        env:
          PLAN_RESULT: ${{ needs.plan-devint.result }}
          APPLY_RESULT: ${{ needs.apply-devint.result }}
        run: |
          echo "## Devint deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Plan: ${PLAN_RESULT}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Apply: ${APPLY_RESULT}" >> "$GITHUB_STEP_SUMMARY"
