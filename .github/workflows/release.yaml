name: Release infrastructure

on:
  pull_request:
    types: [closed]
    branches:
      - 'release-*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-infrastructure-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Stage 1 - Prepare release
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && startsWith(github.base_ref, 'release-')
    runs-on: ubuntu-latest
    outputs:
      release_number: ${{ steps.release.outputs.release_number }}
    steps:
      - id: release
        shell: bash
        run: |
          RELEASE_NUMBER="v1.2.${{ github.run_number }}"
          echo "release_number=$RELEASE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Release Number: $RELEASE_NUMBER"
          echo "## Release Number" >> "$GITHUB_STEP_SUMMARY"
          echo "$RELEASE_NUMBER" >> "$GITHUB_STEP_SUMMARY"

  plan-devint:
    name: Stage 2 - Plan devint
    needs: prepare-release
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && startsWith(github.base_ref, 'release-')
    runs-on: ubuntu-latest
    environment: devint
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      RELEASE_NUMBER: ${{ needs.prepare-release.outputs.release_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
      - name: Initialize Terraform
        working-directory: environments/devint
        run: terraform init -input=false -reconfigure
      - name: Create plan
        working-directory: environments/devint
        run: terraform plan -input=false -out=tfplan
      - uses: actions/upload-artifact@v4
        with:
          name: devint-tfplan-${{ github.run_id }}
          path: environments/devint/tfplan

  apply-devint:
    name: Stage 3 - Apply devint
    needs: [prepare-release, plan-devint]
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && startsWith(github.base_ref, 'release-') && needs.plan-devint.result == 'success'
    runs-on: ubuntu-latest
    environment: devint
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      RELEASE_NUMBER: ${{ needs.prepare-release.outputs.release_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
      - uses: actions/download-artifact@v4
        with:
          name: devint-tfplan-${{ github.run_id }}
          path: environments/devint
      - name: Initialize Terraform
        working-directory: environments/devint
        run: terraform init -input=false -reconfigure
      - name: Apply plan
        working-directory: environments/devint
        run: terraform apply -input=false tfplan

  notify-devint:
    name: Stage 4 - Notify devint deployment
    needs: [prepare-release, plan-devint, apply-devint]
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.merged == true && startsWith(github.base_ref, 'release-')
    runs-on: ubuntu-latest
    steps:
      - name: Publish result
        env:
          PLAN_RESULT: ${{ needs.plan-devint.result }}
          APPLY_RESULT: ${{ needs.apply-devint.result }}
          RELEASE_NUMBER: ${{ needs.prepare-release.outputs.release_number }}
        run: |
          echo "## Devint deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release Number: ${RELEASE_NUMBER}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Plan: ${PLAN_RESULT}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Apply: ${APPLY_RESULT}" >> "$GITHUB_STEP_SUMMARY"
      - name: Send deployment email
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: 465
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: fit-infra devint deployment
          to: alexinvi@gmail.com
          from: ${{ secrets.SMTP_FROM || secrets.SMTP_USERNAME }}
          body: |
            Devint deployment completed.
            Plan: ${{ needs.plan-devint.result }}
            Apply: ${{ needs.apply-devint.result }}
